name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------------------------
  # Backend — FastAPI + pytest
  # -------------------------------------------------------------------------
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/backend/pyproject.toml

      - name: Install dependencies
        # aiosqlite powers the in-memory SQLite DB used in tests (no PostgreSQL needed)
        run: pip install -e ".[dev]" slowapi aiosqlite

      - name: Run tests with coverage
        run: pytest tests/ --cov=app --cov-report=term-missing --cov-fail-under=65 -q

    env:
      # No real DB needed — conftest.py uses SQLite in-memory
      GS_DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      GS_ANTHROPIC_API_KEY: ""
      GS_GITHUB_CLIENT_ID: local-dev
      GS_GITHUB_CLIENT_SECRET: ""
      GS_GITHUB_ACCESS_TOKEN: ""
      GS_JWT_SECRET: ci-test-jwt-secret-not-for-production
      GS_FRONTEND_URL: http://localhost:4321

  # -------------------------------------------------------------------------
  # Frontend — Astro build
  # -------------------------------------------------------------------------
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check
        env:
          PUBLIC_API_BASE: http://localhost:8000/api/v1
          PUBLIC_WS_BASE: ws://localhost:8000
          PUBLIC_AUTH_REQUIRED: "false"
          PUBLIC_GUEST_TRIAL: "true"

      - name: Build
        run: npm run build
        env:
          PUBLIC_API_BASE: http://localhost:8000/api/v1
          PUBLIC_WS_BASE: ws://localhost:8000
          PUBLIC_AUTH_REQUIRED: "false"
          PUBLIC_GUEST_TRIAL: "true"
